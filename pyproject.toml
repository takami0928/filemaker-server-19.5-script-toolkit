[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fms19-script-toolkit"
version = "0.1.0"
description = "Safe FileMaker Server 19.5 script XML and Windows clipboard toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "kouhei takami"}]
dependencies = [
  "jsonschema>=4.23,<5",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
ci = [
  "build>=1.2,<2",
]

[project.scripts]
fms19 = "fms19_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/fms19-script-toolkit/schemas" = [
  "schemas/script-ir-v1.schema.json",
  "schemas/script-ir-v2.schema.json",
  "schemas/script-ir.schema.json",
]
"share/fms19-script-toolkit/catalog/fm19.5" = [
  "catalog/fm19.5/verified-steps.json",
]
"share/fms19-script-toolkit/catalog/fm19.5/compatibility" = [
  "catalog/fm19.5/compatibility/script-steps.json",
  "catalog/fm19.5/compatibility/sources.json",
]
